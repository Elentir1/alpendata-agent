[project]
name = "alpendata-api"
version = "0.1.0"
description = "AlpenData enterprise control plane for Hermes Agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.133.1",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.51",
  "psycopg[binary]>=3.2,<4",
  "uvicorn==0.41.0",
  "alembic>=1.16,<2",
  "msal>=1.37,<2",
  "requests>=2.32,<3",
  "cryptography>=46,<49",
  "email-validator>=2.2,<3",
  "tzdata>=2025.2,<2027",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-timeout>=2.3,<3", "httpx==0.28.1", "ruff>=0.11,<1", "aiosmtpd>=1.4.6,<2"]

[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["linux_only: requires a real Linux host"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
